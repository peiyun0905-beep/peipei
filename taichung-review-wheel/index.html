<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台中網評美食轉盤</title>
  <style>
    :root {
      --bg: #f7f4ee;
      --card: #ffffff;
      --text: #22201c;
      --muted: #6f685d;
      --border: #e3dccf;
      --accent: #b3261e;
      --accent-dark: #8c1d17;
      --gold: #b8860b;
      --chip-on-text: #ffffff;
      --wheel-line: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17150f;
        --card: #24211a;
        --text: #f3eee4;
        --muted: #b7ad9c;
        --border: #443e32;
        --accent: #ff6b5e;
        --accent-dark: #ff8f85;
        --gold: #e0b44a;
        --chip-on-text: #17150f;
        --wheel-line: #24211a;
      }
    }
    :root[data-theme="dark"] {
      --bg: #17150f;
      --card: #24211a;
      --text: #f3eee4;
      --muted: #b7ad9c;
      --border: #443e32;
      --accent: #ff6b5e;
      --accent-dark: #ff8f85;
      --gold: #e0b44a;
      --chip-on-text: #17150f;
      --wheel-line: #24211a;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      display: grid;
      gap: 18px;
    }
    header h1 { margin: 0; font-size: 1.7rem; }
    header p { margin: 4px 0 0; color: var(--muted); }

    .filters { display: grid; gap: 10px; }
    .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .filter-row .filter-label { font-weight: 600; min-width: 3em; }
    .chip {
      font: inherit;
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--chip-on-text); font-weight: 600; }
    .chip:focus-visible, .spin:focus-visible, .map-link:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 2px; }

    .wheel-wrap {
      position: relative;
      width: min(100%, 440px);
      aspect-ratio: 1;
      margin: 0 auto;
    }
    /* 圓形裁切：轉盤旋轉時，方形畫布的角不會超出版面造成左右捲動 */
    .wheel-clip {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.2);
    }
    .wheel-clip canvas {
      display: block;
      width: 100%;
      height: 100%;
      will-change: transform;
    }
    /* 上方指針 */
    .pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 30px solid var(--text);
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.3));
      z-index: 1;
    }
    .hub {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 20%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--card);
      border: 4px solid var(--gold);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: clamp(0.75rem, 3.2vw, 0.95rem);
      color: var(--gold);
    }

    .spin {
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--chip-on-text);
      cursor: pointer;
    }
    .spin:disabled { opacity: 0.6; cursor: wait; }

    .result {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 120px;
    }
    .result .label { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .result h2 { margin: 2px 0 4px; font-size: 1.6rem; color: var(--accent); overflow-wrap: anywhere; }
    .result .stars { margin: 0 0 4px; font-weight: 700; color: var(--gold); letter-spacing: 1px; }
    .result .where { margin: 0 0 6px; color: var(--muted); }
    .result .desc { margin: 0 0 10px; }
    .result .map-link {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .history h3 { margin: 0 0 6px; font-size: 1rem; }
    .history ol { margin: 0; padding-left: 1.4em; color: var(--muted); }
    .note { color: var(--muted); font-size: 0.85rem; margin: 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>台中網評美食轉盤</h1>
      <p>30 家網路評價最好的台中餐廳，Google 高分與網友推薦名店，轉一下決定吃哪家。</p>
    </header>

    <section class="filters" aria-label="篩選">
      <div class="filter-row" id="group-chips"><span class="filter-label">類別</span></div>
    </section>

    <div class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <div class="wheel-clip"><canvas id="wheel" width="880" height="880" role="img" aria-label="台中網評美食轉盤"></canvas></div>
      <div class="hub" aria-hidden="true">開吃</div>
    </div>

    <button class="spin" id="spin-button" type="button">轉一下！</button>

    <section class="result" id="result" aria-live="polite">
      <p class="label">下一頓吃哪家？</p>
      <h2>按下「轉一下」</h2>
    </section>

    <section class="history" id="history" hidden>
      <h3>最近轉到</h3>
      <ol id="history-list"></ol>
    </section>

    <p class="note">名單整理自 2026 年的網路美食評比文章（食尚玩家、美麗佳人、Dcard 與美食部落客等）。顯示的 Google 評分與評論數是文章刊出時的數字，評分會隨時間變動；沒有列出評分的店家，是在多篇推薦文或網友整理中被重複推薦。部分店家有多間分店，標示的是文章評比的那一家。出發前請用地圖確認最新評價與營業時間。</p>
  </main>

  <script>
    (function () {
      "use strict";

      // 台中網評名單：名稱、類別、Google 評分（文章刊出時，無則留空）、評論數、介紹（只寫來源文章提到的資訊）。
      // 資料整理自 2026 年的網路美食評比文章，整理日期 2026 年 11 月。
      var PLACES = [
        { name: "屋馬燒肉 崇德店", cat: "燒肉鍋物", rating: "4.9", reviews: "約 7 萬則", desc: "台中燒肉排隊名店，崇德店評論數極多仍維持高分。" },
        { name: "老井極上燒肉 美村店", cat: "燒肉鍋物", rating: "4.9", reviews: "", desc: "位於西區美村路，招牌是 30 公分長的巨無霸牛舌。" },
        { name: "森森燒肉 中科店", cat: "燒肉鍋物", rating: "4.9", reviews: "", desc: "燒肉加自助吧，沙拉、甜點、熟食、飲品和冰淇淋都有。" },
        { name: "六本木燒肉", cat: "燒肉鍋物", rating: "4.7", reviews: "", desc: "" },
        { name: "俺達の肉屋", cat: "燒肉鍋物", rating: "4.5", reviews: "", desc: "日式燒肉，米其林一星，不定期從日本進口各產地的牛肉。" },
        { name: "茶六燒肉堂 公益店", cat: "燒肉鍋物", rating: "", reviews: "", desc: "多篇台中美食推薦文的首選燒肉店。" },
        { name: "湯棧", cat: "燒肉鍋物", rating: "4.5", reviews: "", desc: "輕井澤集團旗下的火鍋品牌，台中有 2 間分店。" },
        { name: "菁饌涮涮鍋", cat: "燒肉鍋物", rating: "4.5", reviews: "", desc: "" },
        { name: "汕頭牛肉劉沙茶爐", cat: "燒肉鍋物", rating: "", reviews: "", desc: "沙茶火鍋，入選食尚玩家 Google 4 星以上台中餐廳榜。" },
        { name: "春囍打邊爐", cat: "燒肉鍋物", rating: "", reviews: "", desc: "港式火鍋，入選食尚玩家 Google 4 星以上台中餐廳榜。" },
        { name: "一鷺串燒居酒屋 中興店", cat: "日式料理", rating: "4.9", reviews: "約 7,068 則", desc: "台中居酒屋評分排行前段班（2026 年 7 月 30 日查詢）。" },
        { name: "柒息地串燒居酒屋 逢甲店", cat: "日式料理", rating: "4.9", reviews: "約 5,845 則", desc: "台中居酒屋評分排行前段班（2026 年 7 月 30 日查詢）。" },
        { name: "武藏亭日本料理", cat: "日式料理", rating: "4.6", reviews: "", desc: "" },
        { name: "拾飯", cat: "日式料理", rating: "4.6", reviews: "", desc: "" },
        { name: "和食望月", cat: "日式料理", rating: "4.5", reviews: "", desc: "" },
        { name: "御閣手作壽司", cat: "日式料理", rating: "4.5", reviews: "", desc: "" },
        { name: "阿裕壽司", cat: "日式料理", rating: "4.4", reviews: "約 8,000 則", desc: "評論數很多的平價壽司名店。" },
        { name: "菲菲花園義大利餐廳", cat: "西式早午餐", rating: "4.8", reviews: "近 5,000 則", desc: "西屯區開業 20 年的義大利餐廳。" },
        { name: "渼金咖哩", cat: "西式早午餐", rating: "4.8", reviews: "", desc: "" },
        { name: "別嗆大叔", cat: "西式早午餐", rating: "4.6", reviews: "", desc: "咖哩專賣。" },
        { name: "香緹果子咖啡館", cat: "西式早午餐", rating: "4.5", reviews: "", desc: "在地人推薦的千層蛋糕名店。" },
        { name: "柒·柒手作料理 綏遠店", cat: "西式早午餐", rating: "4.5", reviews: "約 310 則", desc: "早午餐。" },
        { name: "旭暮 mu café", cat: "西式早午餐", rating: "4.4", reviews: "約 1,209 則", desc: "早午餐。" },
        { name: "傑克兄弟牛排館 公益店", cat: "西式早午餐", rating: "", reviews: "", desc: "牛排館，常出現在 Dcard 風格的台中美食推薦清單。" },
        { name: "老蔡大麵焿", cat: "小吃麵食", rating: "4.6", reviews: "", desc: "每週只營業兩天，去之前一定要先確認。" },
        { name: "順口香麥仔煎", cat: "小吃麵食", rating: "4.4", reviews: "", desc: "1987 年創立的第三市場名店，熱門時段常大排長龍。" },
        { name: "老士官擀麵", cat: "小吃麵食", rating: "4.3", reviews: "", desc: "清水經營近 60 年的麵店，也是米其林必比登推介。" },
        { name: "可口牛肉麵", cat: "小吃麵食", rating: "4.3", reviews: "近千則", desc: "南屯的老字號牛肉麵，也是米其林必比登推介。" },
        { name: "桂蘭麵", cat: "小吃麵食", rating: "", reviews: "", desc: "美食部落客「最最推」的台中美食之一。" },
        { name: "小阿姨滷肉飯 清水店", cat: "小吃麵食", rating: "", reviews: "", desc: "Dcard 網友推薦，招牌是蒸蛋滷肉飯。" }
      ];
      var GROUPS = ["燒肉鍋物", "日式料理", "西式早午餐", "小吃麵食"];
      var GROUP_LABELS = { "燒肉鍋物": "燒肉・鍋物", "日式料理": "日式・居酒屋", "西式早午餐": "西式・咖哩・早午餐", "小吃麵食": "小吃・麵食" };
      var COLORS = ["#c92a2a", "#e8590c", "#f08c00", "#2b8a3e", "#0b7285", "#1864ab", "#5f3dc4", "#a61e4d"];
      var TAU = Math.PI * 2;

      var canvas = document.getElementById("wheel");
      var ctx = canvas.getContext("2d");
      var spinButton = document.getElementById("spin-button");
      var result = document.getElementById("result");
      var groupBox = document.getElementById("group-chips");
      var historyBox = document.getElementById("history");
      var historyList = document.getElementById("history-list");

      var selected = GROUPS.slice();
      var items = PLACES.slice();
      var rotation = 0;    // 目前轉盤角度（弧度，順時針為正）
      var spinning = false;
      var history = [];
      var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function ratingText(item) {
        if (!item.rating) return "網友推薦名店";
        return "Google ★ " + item.rating + (item.reviews ? "（" + item.reviews + "評論）" : "");
      }

      // 轉盤上只顯示店名（去掉空格後的分店名），讓字不會縮太小；結果卡顯示完整名稱
      function wheelLabel(item) { return item.name.split(" ")[0]; }

      function lineColor() {
        return getComputedStyle(document.documentElement).getPropertyValue("--wheel-line").trim() || "#fff";
      }

      // 畫轉盤：第 0 格從正上方開始，順時針排列。
      function drawWheel() {
        var size = canvas.width, c = size / 2, r = c - 6;
        var arc = TAU / Math.max(items.length, 1);
        var baseSize = items.length > 20 ? 28 : items.length > 12 ? 32 : items.length > 6 ? 38 : 46;
        ctx.clearRect(0, 0, size, size);
        if (!items.length) return;
        items.forEach(function (item, i) {
          var start = -Math.PI / 2 + i * arc;
          ctx.beginPath();
          ctx.moveTo(c, c);
          ctx.arc(c, c, r, start, start + arc);
          ctx.closePath();
          var color = COLORS[i % COLORS.length];
          // 最後一格避免與第一格同色
          if (i === items.length - 1 && i % COLORS.length === 0 && i > 0) color = COLORS[4];
          ctx.fillStyle = color;
          ctx.fill();
          ctx.lineWidth = items.length > 20 ? 2 : 4;
          ctx.strokeStyle = lineColor();
          ctx.stroke();

          ctx.save();
          ctx.translate(c, c);
          ctx.rotate(start + arc / 2);
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "rgba(0,0,0,0.5)";
          ctx.shadowBlur = 4;
          // 名稱太長時自動縮小字級，避免文字壓到中間的圓心
          var maxWidth = r - 44 - size * 0.1 - 16;
          var fs = baseSize;
          do {
            ctx.font = "700 " + fs + "px system-ui, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif";
            fs -= 2;
          } while (ctx.measureText(wheelLabel(item)).width > maxWidth && fs > 16);
          ctx.fillText(wheelLabel(item), r - 44, 0);   // 離外圈留空間，避免被上方指針蓋住
          ctx.restore();
        });
      }

      function setRotation(rad) {
        rotation = rad;
        canvas.style.transform = "rotate(" + rad + "rad)";
      }

      // 指針在正上方：轉盤順時針轉了 rotation，指針對到的是第 floor((-rotation mod 2π) / 每格角度) 格。
      function indexAtPointer() {
        var arc = TAU / items.length;
        var a = ((-rotation % TAU) + TAU) % TAU;
        return Math.floor(a / arc) % items.length;
      }

      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

      function spin() {
        if (spinning || items.length < 2) return;
        spinning = true;
        spinButton.disabled = true;
        result.innerHTML = '<p class="label">轉盤轉動中…</p><h2>猜猜看是哪一家？</h2>';

        var arc = TAU / items.length;
        var target = Math.floor(Math.random() * items.length);
        var jitter = (Math.random() - 0.5) * arc * 0.7;   // 停在該格內的隨機位置，不壓線
        var desired = -(target + 0.5) * arc + jitter;
        var delta = ((desired - rotation) % TAU + TAU) % TAU;
        var turns = reduceMotion ? 0 : 5 + Math.floor(Math.random() * 3);
        var from = rotation;
        var to = rotation + turns * TAU + delta;
        var duration = reduceMotion ? 400 : 4500;
        var t0 = null;

        function frame(now) {
          if (t0 === null) t0 = now;
          var t = Math.min(1, (now - t0) / duration);
          setRotation(from + (to - from) * easeOutCubic(t));
          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            setRotation(to % TAU);
            spinning = false;
            spinButton.disabled = false;
            showResult(items[indexAtPointer()]);
          }
        }
        requestAnimationFrame(frame);
      }

      function showResult(item) {
        result.textContent = "";
        var label = document.createElement("p");
        label.className = "label";
        label.textContent = "這一餐就吃";
        var h2 = document.createElement("h2");
        h2.textContent = item.name;
        var award = document.createElement("p");
        award.className = "stars";
        award.textContent = ratingText(item);
        var where = document.createElement("p");
        where.className = "where";
        where.textContent = "類別：" + GROUP_LABELS[item.cat];
        var desc = document.createElement("p");
        desc.className = "desc";
        desc.textContent = item.desc || "2026 年網路美食評比的高分店家。";
        var map = document.createElement("a");
        map.className = "map-link";
        map.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(item.name + " 台中");
        map.target = "_blank";
        map.rel = "noopener noreferrer";
        map.textContent = "在 Google 地圖查看";
        result.append(label, h2, award, where, desc, map);

        history.unshift(item.name + "（" + (item.rating ? "Google " + item.rating : "網友推薦") + "）");
        history = history.slice(0, 5);
        historyList.textContent = "";
        history.forEach(function (text) {
          var li = document.createElement("li");
          li.textContent = text;
          historyList.appendChild(li);
        });
        historyBox.hidden = false;
      }

      function applyFilter() {
        items = PLACES.filter(function (p) { return selected.indexOf(p.cat) !== -1; });
        setRotation(0);
        drawWheel();
        spinButton.disabled = items.length < 2;
        if (items.length < 2) {
          result.innerHTML = '<p class="label">選項太少</p><h2>符合條件的餐廳不到 2 家，請多選一些類別</h2>';
        } else {
          result.innerHTML = '<p class="label">共 ' + items.length + ' 家餐廳</p><h2>按下「轉一下」</h2>';
        }
      }

      GROUPS.forEach(function (group) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = GROUP_LABELS[group] + "（" + PLACES.filter(function (p) { return p.cat === group; }).length + "）";
        btn.setAttribute("aria-pressed", "true");
        btn.dataset.value = group;
        btn.addEventListener("click", function () {
          if (spinning) return;
          var on = btn.getAttribute("aria-pressed") === "true";
          btn.setAttribute("aria-pressed", on ? "false" : "true");
          selected = Array.prototype.filter.call(groupBox.querySelectorAll(".chip"), function (b) {
            return b.getAttribute("aria-pressed") === "true";
          }).map(function (b) { return b.dataset.value; });
          applyFilter();
        });
        groupBox.appendChild(btn);
      });

      spinButton.addEventListener("click", spin);
      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        if (mq.addEventListener) mq.addEventListener("change", drawWheel);
      }

      drawWheel();
    })();
  </script>
</body>
</html>
