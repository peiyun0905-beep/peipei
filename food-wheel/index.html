<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>全台美食轉盤</title>
  <meta name="theme-color" content="#d9480f">
  <meta name="description" content="全台 20 家小吃名店轉盤，轉一下決定吃哪家。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="美食轉盤">
  <style>
    :root {
      --bg: #fff8ef;
      --card: #ffffff;
      --text: #2b2118;
      --muted: #7a6a5a;
      --border: #ead9c4;
      --accent: #d9480f;
      --accent-dark: #a8380b;
      --chip-on-text: #ffffff;
      --wheel-line: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1d1712;
        --card: #2a221b;
        --text: #f5ece2;
        --muted: #bba995;
        --border: #4a3d31;
        --accent: #ff7a3d;
        --accent-dark: #ff9a66;
        --chip-on-text: #1d1712;
        --wheel-line: #2a221b;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1d1712;
      --card: #2a221b;
      --text: #f5ece2;
      --muted: #bba995;
      --border: #4a3d31;
      --accent: #ff7a3d;
      --accent-dark: #ff9a66;
      --chip-on-text: #1d1712;
      --wheel-line: #2a221b;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 40px;
      display: grid;
      gap: 20px;
    }
    header h1 { margin: 0; font-size: 1.7rem; }
    header p { margin: 4px 0 0; color: var(--muted); }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip.install { margin-top: 10px; }
    .chip {
      font: inherit;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--chip-on-text); font-weight: 600; }
    .chip:focus-visible, .spin:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 2px; }

    .wheel-wrap {
      position: relative;
      width: min(100%, 420px);
      aspect-ratio: 1;
      margin: 0 auto;
    }
    /* 圓形裁切：轉盤旋轉時，方形畫布的角不會超出版面造成左右捲動 */
    .wheel-clip {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
    }
    .wheel-clip canvas {
      display: block;
      width: 100%;
      height: 100%;
      will-change: transform;
    }
    /* 上方指針 */
    .pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 16px solid transparent;
      border-right: 16px solid transparent;
      border-top: 30px solid var(--text);
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.3));
      z-index: 1;
    }
    .hub {
      position: absolute;
      inset: 50% auto auto 50%;
      width: 22%;
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: var(--card);
      border: 4px solid var(--accent);
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: clamp(0.8rem, 3.5vw, 1rem);
      color: var(--accent);
    }

    .spin {
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: var(--chip-on-text);
      cursor: pointer;
    }
    .spin:disabled { opacity: 0.6; cursor: wait; }

    .result {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 112px;
    }
    .result .label { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .result h2 { margin: 2px 0 4px; font-size: 1.6rem; color: var(--accent); }
    .result .place { margin: 0 0 6px; font-weight: 600; }
    .result .where { margin: 0 0 6px; color: var(--muted); }
    .result .desc { margin: 0 0 10px; }
    .result .map-link {
      display: inline-block;
      padding: 8px 14px;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }
    .result .map-link:focus-visible { outline: 3px solid var(--accent-dark); outline-offset: 2px; }

    .history h3 { margin: 0 0 6px; font-size: 1rem; }
    .history ol { margin: 0; padding-left: 1.4em; color: var(--muted); }
    .note { color: var(--muted); font-size: 0.85rem; margin: 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>全台美食轉盤</h1>
      <p>不知道去哪家吃？轉一下，讓轉盤幫你挑一家名店。</p>
      <button class="chip install" id="install-button" type="button" hidden>安裝到主畫面</button>
    </header>

    <section aria-label="選擇地區">
      <div class="chips" id="region-chips"></div>
    </section>

    <div class="wheel-wrap">
      <div class="pointer" aria-hidden="true"></div>
      <div class="wheel-clip"><canvas id="wheel" width="840" height="840" role="img" aria-label="美食轉盤"></canvas></div>
      <div class="hub" aria-hidden="true">開吃</div>
    </div>

    <button class="spin" id="spin-button" type="button">轉一下！</button>

    <section class="result" id="result" aria-live="polite">
      <p class="label">今天吃什麼？</p>
      <h2>按下「轉一下」</h2>
    </section>

    <section class="history" id="history" hidden>
      <h3>最近轉到</h3>
      <ol id="history-list"></ol>
    </section>

    <p class="note">名單整理自公開美食報導（2026 年 11 月），挑的是各地常被推薦的老店，「最好吃」見仁見智。店家可能休息、搬遷或調整營業時間，出發前請先用地圖或店家社群確認。</p>
  </main>

  <script>
    (function () {
      "use strict";

      // 美食名單：商家名稱、招牌小吃、所在地、所屬區域、簡短介紹。
      // 商家資料整理自 2026 年 11 月的公開美食報導；營業時間常有變動，出發前請先確認。
      var FOODS = [
        { shop: "金峰魯肉飯", dish: "滷肉飯", place: "台北市中正區（中正紀念堂附近）", region: "北部", desc: "肥瘦相間的滷肉淋上白飯，鹹香下飯，營業到深夜。" },
        { shop: "福州世祖胡椒餅", dish: "胡椒餅", place: "台北市松山區饒河街夜市", region: "北部", desc: "貼在炭爐壁上烤，酥皮裡是胡椒肉餡和大把青蔥，曾獲必比登推介。" },
        { shop: "天盛舖營養三明治", dish: "營養三明治", place: "基隆廟口夜市 58 號攤", region: "北部", desc: "炸得酥脆的麵包夾滷蛋、火腿、小黃瓜和美乃滋。" },
        { shop: "吳家鼎邊趖", dish: "鼎邊趖", place: "基隆廟口夜市", region: "北部", desc: "米漿沿著鍋邊燙成米片，配上料多的羹湯。" },
        { shop: "王水成老店水成館", dish: "臭豆腐", place: "新北市深坑老街", region: "北部", desc: "豆腐軟嫩、口味偏重，蒜香臭豆腐是特色。" },
        { shop: "阿柑姨芋圓", dish: "芋圓", place: "新北市瑞芳區九份", region: "北部", desc: "現做芋圓冷熱都有，窗邊座位可以看海。" },
        { shop: "海瑞摃丸", dish: "摃丸", place: "新竹市北區西門街", region: "北部", desc: "1960 年代起把摃丸做成新竹名產，Q 彈有嚼勁。" },
        { shop: "阿明師老太陽堂", dish: "太陽餅", place: "台中市中區自由路", region: "中部", desc: "太陽餅發明人魏清海一脈相傳的老店，麥芽餡濃郁。" },
        { shop: "春水堂四維創始店", dish: "珍珠奶茶", place: "台中市西區四維街", region: "中部", desc: "常被稱為珍珠奶茶發源地的創始店。" },
        { shop: "老担阿璋肉圓", dish: "肉圓", place: "彰化市", region: "中部", desc: "1948 年創立，Q 皮包著筍丁、後腿肉和香菇。" },
        { shop: "噴水雞肉飯", dish: "火雞肉飯", place: "嘉義市西區中山路（噴水圓環旁）", region: "南部", desc: "嘉義雞肉飯代表老店，火雞肉絲淋雞油與醬汁。" },
        { shop: "阿村牛肉湯", dish: "牛肉湯", place: "台南市中西區保安路", region: "南部", desc: "1968 年創立，清晨就開賣，牛肉片用熱湯一沖就熟；賣完提早收。" },
        { shop: "富盛號碗粿", dish: "碗粿", place: "台南市中西區", region: "南部", desc: "第三代經營的碗粿老店，配肉燥與蛋黃。" },
        { shop: "度小月擔仔麵", dish: "擔仔麵", place: "台南市中西區中正路（原始店）", region: "南部", desc: "1895 年創立，百年肉燥配小碗油麵與蝦仁。" },
        { shop: "鄭老牌木瓜牛奶", dish: "木瓜牛奶", place: "高雄市新興區六合夜市入口", region: "南部", desc: "1965 年創立，選用屏東木瓜現打，香濃順口。" },
        { shop: "海鴻飯店", dish: "萬巒豬腳", place: "屏東縣萬巒鄉豬腳街", region: "南部", desc: "萬巒豬腳代表老店，豬腳軟 Q，配特調醬料。" },
        { shop: "正好鮮肉小籠包", dish: "小籠包", place: "宜蘭市泰山路", region: "東部離島", desc: "宜蘭排隊名店，現包現蒸，只能外帶。" },
        { shop: "液香扁食", dish: "扁食", place: "花蓮市信義街", region: "東部離島", desc: "菜單只有扁食湯，皮薄餡多；只賣上午，週日公休。" },
        { shop: "全美行池上便當", dish: "池上便當", place: "台東縣池上鄉（池上車站附近）", region: "東部離島", desc: "早年在月台賣鐵路便當的老店，池上米飯配菜。" },
        { shop: "易家仙人掌冰", dish: "仙人掌冰", place: "澎湖縣白沙鄉（跨海大橋旁）", region: "東部離島", desc: "相傳是澎湖最早賣仙人掌冰的店，紫紅色店面很醒目。" }
      ];
      var REGIONS = ["北部", "中部", "南部", "東部離島"];
      var COLORS = ["#f76707", "#fab005", "#40c057", "#15aabf", "#4c6ef5", "#be4bdb", "#f03e3e", "#12b886"];
      var TAU = Math.PI * 2;

      var canvas = document.getElementById("wheel");
      var ctx = canvas.getContext("2d");
      var spinButton = document.getElementById("spin-button");
      var result = document.getElementById("result");
      var chipsBox = document.getElementById("region-chips");
      var historyBox = document.getElementById("history");
      var historyList = document.getElementById("history-list");

      var selected = REGIONS.slice();
      var items = FOODS.slice();
      var rotation = 0;    // 目前轉盤角度（弧度，順時針為正）
      var spinning = false;
      var history = [];
      var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function lineColor() {
        return getComputedStyle(document.documentElement).getPropertyValue("--wheel-line").trim() || "#fff";
      }

      // 畫轉盤：第 0 格從正上方開始，順時針排列。
      function drawWheel() {
        var size = canvas.width, c = size / 2, r = c - 6;
        var arc = TAU / items.length;
        var fontSize = items.length > 14 ? 30 : items.length > 8 ? 36 : 44;
        ctx.clearRect(0, 0, size, size);
        items.forEach(function (item, i) {
          var start = -Math.PI / 2 + i * arc;
          ctx.beginPath();
          ctx.moveTo(c, c);
          ctx.arc(c, c, r, start, start + arc);
          ctx.closePath();
          var color = COLORS[i % COLORS.length];
          // 格數為奇數時，最後一格避免與第一格同色
          if (i === items.length - 1 && i % COLORS.length === 0 && i > 0) color = COLORS[3];
          ctx.fillStyle = color;
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = lineColor();
          ctx.stroke();

          ctx.save();
          ctx.translate(c, c);
          ctx.rotate(start + arc / 2);
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "rgba(0,0,0,0.45)";
          ctx.shadowBlur = 4;
          // 店名太長時自動縮小字級，避免文字壓到中間的圓心
          var maxWidth = r - 44 - size * 0.11 - 16;
          var fs = fontSize;
          do {
            ctx.font = "700 " + fs + "px system-ui, 'PingFang TC', 'Microsoft JhengHei', 'Noto Sans TC', sans-serif";
            fs -= 2;
          } while (ctx.measureText(item.shop).width > maxWidth && fs > 16);
          ctx.fillText(item.shop, r - 44, 0);   // 離外圈留空間，避免被上方指針蓋住
          ctx.restore();
        });
      }

      function setRotation(rad) {
        rotation = rad;
        canvas.style.transform = "rotate(" + rad + "rad)";
      }

      // 指針在正上方：轉盤順時針轉了 rotation，指針對到的是第 floor((-rotation mod 2π) / 每格角度) 格。
      function indexAtPointer() {
        var arc = TAU / items.length;
        var a = ((-rotation % TAU) + TAU) % TAU;
        return Math.floor(a / arc) % items.length;
      }

      function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

      function spin() {
        if (spinning || items.length < 2) return;
        spinning = true;
        spinButton.disabled = true;
        result.innerHTML = '<p class="label">轉盤轉動中…</p><h2>猜猜看是哪一個？</h2>';

        var arc = TAU / items.length;
        var target = Math.floor(Math.random() * items.length);
        var jitter = (Math.random() - 0.5) * arc * 0.7;   // 停在該格內的隨機位置，不壓線
        var desired = -(target + 0.5) * arc + jitter;
        var delta = ((desired - rotation) % TAU + TAU) % TAU;
        var turns = reduceMotion ? 0 : 5 + Math.floor(Math.random() * 3);
        var from = rotation;
        var to = rotation + turns * TAU + delta;
        var duration = reduceMotion ? 400 : 4500;
        var t0 = null;

        function frame(now) {
          if (t0 === null) t0 = now;
          var t = Math.min(1, (now - t0) / duration);
          setRotation(from + (to - from) * easeOutCubic(t));
          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            setRotation(to % TAU);
            spinning = false;
            spinButton.disabled = false;
            showResult(items[indexAtPointer()]);
          }
        }
        requestAnimationFrame(frame);
      }

      function showResult(item) {
        result.textContent = "";
        var label = document.createElement("p");
        label.className = "label";
        label.textContent = "今天就去吃";
        var h2 = document.createElement("h2");
        h2.textContent = item.shop;
        var dish = document.createElement("p");
        dish.className = "place";
        dish.textContent = "招牌：" + item.dish;
        var place = document.createElement("p");
        place.className = "where";
        place.textContent = "地點：" + item.place;
        var desc = document.createElement("p");
        desc.className = "desc";
        desc.textContent = item.desc;
        var map = document.createElement("a");
        map.className = "map-link";
        map.href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(item.shop + " " + item.place);
        map.target = "_blank";
        map.rel = "noopener noreferrer";
        map.textContent = "在 Google 地圖查看";
        result.append(label, h2, dish, place, desc, map);

        history.unshift(item.shop + "（" + item.dish + "）");
        history = history.slice(0, 5);
        historyList.textContent = "";
        history.forEach(function (text) {
          var li = document.createElement("li");
          li.textContent = text;
          historyList.appendChild(li);
        });
        historyBox.hidden = false;
      }

      function applyFilter() {
        items = FOODS.filter(function (f) { return selected.indexOf(f.region) !== -1; });
        setRotation(0);
        drawWheel();
        spinButton.disabled = items.length < 2;
        if (items.length < 2) {
          result.innerHTML = '<p class="label">選項太少</p><h2>請至少選一個地區</h2>';
        }
      }

      REGIONS.forEach(function (region) {
        var count = FOODS.filter(function (f) { return f.region === region; }).length;
        var btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip";
        btn.textContent = region + "（" + count + "）";
        btn.setAttribute("aria-pressed", "true");
        btn.addEventListener("click", function () {
          if (spinning) return;
          var on = btn.getAttribute("aria-pressed") === "true";
          btn.setAttribute("aria-pressed", on ? "false" : "true");
          selected = REGIONS.filter(function (r, i) {
            return chipsBox.children[i].getAttribute("aria-pressed") === "true";
          });
          applyFilter();
        });
        chipsBox.appendChild(btn);
      });

      spinButton.addEventListener("click", spin);
      if (window.matchMedia) {
        var mq = window.matchMedia("(prefers-color-scheme: dark)");
        if (mq.addEventListener) mq.addEventListener("change", drawWheel);
      }

      drawWheel();
    })();
  </script>
  <script>
    // PWA：註冊離線快取，並在瀏覽器允許時顯示「安裝到主畫面」按鈕
    (function () {
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
      var installButton = document.getElementById("install-button");
      var deferred = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        deferred = event;
        installButton.hidden = false;
      });
      installButton.addEventListener("click", function () {
        if (!deferred) return;
        deferred.prompt();
        deferred.userChoice.finally(function () {
          deferred = null;
          installButton.hidden = true;
        });
      });
      window.addEventListener("appinstalled", function () { installButton.hidden = true; });
    })();
  </script>
</body>
</html>
